<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planning Clan · Destiny 2 · Gothic</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <style>
        /* ---------- BASE GOTHIQUE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cinzel', serif;
            background: #000000;
            color: #eeeeee;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }
        .app {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: center;
            max-width: 1800px;
            width: 100%;
        }

        /* ---------- MENU (élargi) ---------- */
        .menu {
            background: #0a0a0a;
            padding: 28px 24px;
            border-radius: 0px;
            width: 620px;
            max-height: 920px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.9);
            border: 1px solid #ffffff;
        }
        .menu h2 {
            font-weight: 700;
            letter-spacing: 5px;
            font-size: 1.65rem;
            margin-bottom: 18px;
            border-bottom: 2px solid #ffffff;
            padding-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            color: #ffffff;
            text-transform: uppercase;
        }
        .menu h2 small {
            font-size: 0.6rem;
            color: #888;
            font-weight: 400;
            background: #1a1a1a;
            padding: 4px 14px;
            border: 1px solid #333;
            letter-spacing: 1px;
        }
        .day-controls {
            flex: 1;
            overflow-y: auto;
            padding-right: 6px;
        }
        .day-controls::-webkit-scrollbar {
            width: 6px;
        }
        .day-controls::-webkit-scrollbar-track {
            background: #111;
        }
        .day-controls::-webkit-scrollbar-thumb {
            background: #fff;
        }

        .day-control {
            background: #0d0d0d;
            border-radius: 0px;
            padding: 15px 16px;
            margin-bottom: 10px;
            border-left: 3px solid #333;
            border-bottom: 1px solid #1a1a1a;
            transition: 0.2s;
        }
        .day-control .day-label {
            font-weight: 700;
            font-size: 1.08rem;
            color: #ccc;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .day-control .day-label span {
            background: #1a1a1a;
            padding: 0 14px;
            border: 1px solid #333;
            font-size: 0.6rem;
            color: #aaa;
        }

        .slot-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 5px 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #1a1a1a;
            padding: 6px 8px;
            margin-top: 4px;
        }
        .slot-row .slot-label {
            font-size: 1.08rem;
            font-weight: 700;
            color: #777;
            min-width: 36px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
            pointer-events: auto;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #222;
            border: 1px solid #444;
            transition: 0.3s;
        }
        .slider::before {
            content: "";
            position: absolute;
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background: #666;
            transition: 0.3s;
        }
        .switch input:checked+.slider {
            background: #ffffff;
            border-color: #ffffff;
        }
        .switch input:checked+.slider::before {
            background: #000000;
            transform: translateX(18px);
        }

        .slot-row select,
        .slot-row input[type="time"] {
            background: #000;
            border: 1px solid #333;
            padding: 6px 9px;
            color: #fff;
            font-size: 1.12rem;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            flex: 1;
            min-width: 50px;
            height: 36px;
            border-radius: 0;
        }
        .slot-row select {
            flex: 1.2;
            min-width: 80px;
        }
        .slot-row select option {
            background: #000;
            color: #fff;
        }

        .slot-row select optgroup {
            background: #0b0b0b;
            color: #9a9a9a;
            font-family: 'Cinzel', serif;
            font-weight: 700;
        }

        .slot-row select optgroup option {
            background: #000;
            color: #fff;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
        }
        .slot-row input[type="time"] {
            flex: 0.5;
            min-width: 60px;
        }
        .slot-row select:focus,
        .slot-row input:focus {
            outline: 1px solid #fff;
            border-color: #fff;
        }
        .slot-row.inactive-slot {
            opacity: 0.4;
        }

        .slot-row .tag-select {
            flex: 0.6;
            min-width: 55px;
            background: #000;
            border: 1px solid #333;
            padding: 6px 8px;
            color: #fff;
            font-size: 1.08rem;
            font-family: 'Cinzel', serif;
            height: 36px;
        }
        .slot-row .tag-select option {
            background: #000;
            color: #fff;
        }

        .menu-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .btn {
            padding: 8px 16px;
            border: 1px solid #fff;
            border-radius: 0px;
            font-weight: 700;
            font-size: 1.12rem;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            transition: 0.2s;
            background: transparent;
            color: #fff;
            flex: 1;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #444;
            color: #aaa;
        }
        .btn-outline:hover {
            background: #1a1a1a;
            border-color: #fff;
            color: #fff;
        }
        .btn-primary {
            background: #fff;
            color: #000;
            border: 1px solid #fff;
        }
        .btn-primary:hover {
            background: #000;
            color: #fff;
        }
        .btn-danger {
            color: #ff4444;
            border-color: #ff4444;
        }
        .btn-danger:hover {
            background: #ff4444;
            color: #000;
        }

        /* ---------- PRÉVISUALISATION GOLEM : 1 JOUR / 2 CRÉNEAUX ---------- */
        .preview-wrapper {
            background: #0a0a0a;
            padding: 18px;
            border-radius: 0;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.9);
            border: 1px solid #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .preview-wrapper h2 {
            font-weight: 700;
            letter-spacing: 5px;
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #aaa;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            width: 100%;
            text-align: center;
        }

        .planning-card {
            width: 820px;
            height: auto;
            min-height: 640px;
            background-color: #000;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.62), rgba(0, 0, 0, 0.62)),
                url('font.png');
            background-size: auto 100%;
            background-position: center center;
            background-repeat: no-repeat;
            border: 2px solid #fff;
            padding: 24px 26px 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .planning-card .header {
            text-align: center;
            margin-bottom: 16px;
            flex-shrink: 0;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
        }

        .planning-card .header h1 {
            font-size: 2.55rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-family: 'Cinzel', serif;
        }

        .planning-card .header .ornament {
            color: #888;
            font-size: .65rem;
            letter-spacing: 10px;
            margin-top: 2px;
        }

        .planning-card .header p {
            font-size: .92rem;
            color: #777;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-top: 1px solid #222;
            padding-top: 6px;
            margin-top: 4px;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
        }

        .planning-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: visible;
            margin-bottom: 8px;
        }

        .day-row {
            background: rgba(10, 10, 10, 0.42);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-left: 4px solid #2a2a2a;
            display: grid;
            grid-template-columns: 78px 1fr 1fr;
            min-height: 88px;
            align-items: stretch;
        }

        .day-row.has-slots {
            border-left-color: #fff;
            background: rgba(10, 10, 10, 0.42);
        }

        .day-row.inactive {
            min-height: 46px;
            opacity: .42;
            grid-template-columns: 78px 1fr;
        }

        .day-row .day-abbr {
            font-weight: 700;
            font-size: 1.28rem;
            color: #d7d7d7;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Cinzel', serif;
            border-right: 1px solid #1e1e1e;
        }

        .slots-container {
            display: contents;
        }

        .slot-line {
            min-width: 0;
            display: grid;
            grid-template-columns: 68px 1fr;
            grid-template-rows: auto auto;
            column-gap: 10px;
            row-gap: 5px;
            align-content: center;
            padding: 12px 16px;
            border-right: 1px solid #1e1e1e;
            font-family: 'Cormorant Garamond', serif;
        }

        .slot-line:last-child {
            border-right: 0;
        }

        .slot-line.slot-off {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-family: 'Cinzel', serif;
            font-size: .90rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .slot-line .slot-time {
            grid-column: 1;
            grid-row: 1;
            background: #111;
            border: 1px solid #262626;
            padding: 4px 8px;
            color: #cfcfcf;
            font-weight: 700;
            font-size: .90rem;
            white-space: nowrap;
            text-align: center;
            letter-spacing: .4px;
            font-family: 'Cinzel', serif;
            align-self: center;
        }

        .slot-line .slot-activity {
            grid-column: 2;
            grid-row: 1;
            color: #fff;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 1.24rem;
            font-style: italic;
            align-self: center;
        }

        .slot-line .slot-tag {
            grid-column: 2;
            grid-row: 2;
            justify-self: start;
            font-size: .84rem;
            padding: 3px 8px;
            border: 1px solid #444;
            color: #fff;
            white-space: nowrap;
            letter-spacing: .4px;
            text-transform: uppercase;
            font-family: 'Cinzel', serif;
            font-weight: 700;
        }

        .slot-line .slot-tag.tag-roulette { border-color: #fbbf24; color: #fbbf24; }
        .slot-line .slot-tag.tag-special { border-color: #ef4444; color: #ef4444; }
        .slot-line .slot-tag.tag-decouverte { border-color: #10b981; color: #10b981; }
        .slot-line .slot-tag.tag-chill { border-color: #8b5cf6; color: #8b5cf6; }
        .slot-line .slot-tag.tag-maitrise { border-color: #9ca3af; color: #c9c9ce; }
        .slot-line .slot-tag.tag-custom { border-color: #fff; color: #fff; background: #111; }

        .day-row .day-off {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .94rem;
            color: #444;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .planning-card .footer {
            text-align: center;
            font-size: .55rem;
            color: #555;
            border-top: 1px solid #222;
            padding-top: 7px;
            letter-spacing: 3px;
            flex-shrink: 0;
            text-transform: uppercase;
            font-family: 'Cinzel', serif;
        }

        .planning-card .footer span {
            color: #8b0000;
            font-weight: 700;
        }

        .actions {
            margin-top: 12px;
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .actions .btn {
            flex: 1;
            padding: 12px;
            background: #fff;
            color: #000;
            border: 1px solid #fff;
            font-size: .94rem;
        }

        .actions .btn:hover {
            background: #000;
            color: #fff;
        }

        @media (max-width: 1050px) {
            .planning-card {
                width: min(96vw, 820px);
            }
        }

        @media (max-width: 760px) {
            .planning-card {
                padding: 16px 12px 12px;
            }

            .day-row {
                grid-template-columns: 58px 1fr;
            }

            .day-row .day-abbr {
                grid-row: 1 / span 2;
                font-size: .9rem;
            }

            .slots-container {
                display: grid;
                grid-template-columns: 1fr;
            }

            .slot-line {
                border-right: 0;
                border-bottom: 1px solid #1e1e1e;
                grid-template-columns: 62px 1fr;
                padding: 10px 12px;
            }

            .slot-line:last-child {
                border-bottom: 0;
            }

            .slot-line .slot-activity {
                font-size: .92rem;
            }
        }

        @media (max-width: 1500px) {
            .app { flex-direction: column; align-items: center; }
            .menu { width: min(96vw, 820px); max-height: 620px; }
        }


        .day-row .slots-container {
            grid-column: 2 / 4;
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-width: 0;
        }
        @media (max-width: 760px) {
            .day-row .slots-container {
                grid-column: 2;
                display: grid;
                grid-template-columns: 1fr;
            }
        }

        /* ---------- GOLEM-WEEK / IMPORT BOT ---------- */
        .week-import-panel {
            border: 1px solid #333;
            border-left: 3px solid #fff;
            background: #080808;
            padding: 10px 12px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .week-import-panel .week-title {
            font-family: 'Cinzel', serif;
            font-size: .72rem;
            color: #ddd;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .week-import-row {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            gap: 7px;
            align-items: center;
        }

        .week-import-row label {
            font-family: 'Cormorant Garamond', serif;
            color: #777;
            font-size: .9rem;
        }

        .week-import-row input[type="date"] {
            background: #000;
            color: #fff;
            border: 1px solid #444;
            padding: 7px 9px;
            font-family: 'Cinzel', serif;
            min-width: 0;
        }

        .week-nav-btn {
            height: 34px;
            min-width: 36px;
            padding: 0 10px;
            border: 1px solid #444;
            background: #000;
            color: #bbb;
            font-family: 'Cinzel', serif;
            cursor: pointer;
        }

        .week-nav-btn:hover {
            border-color: #fff;
            color: #fff;
        }

        .week-import-hint {
            margin-top: 7px;
            color: #4c4c4c;
            font-size: .56rem;
            letter-spacing: 1px;
            text-align: center;
        }

        .btn-code {
            border-color: #fff;
            background: #fff;
            color: #000;
        }

        .btn-code:hover {
            background: #000;
            color: #fff;
        }

        .code-status {
            display: none;
            margin-top: 9px;
            padding: 8px 10px;
            border: 1px solid #2f2f2f;
            background: #050505;
            color: #aaa;
            font-family: 'Cormorant Garamond', serif;
            font-size: .8rem;
            line-height: 1.35;
        }

        .code-status.visible {
            display: block;
        }

        .code-status strong {
            color: #fff;
        }

        @media (max-width: 600px) {
            .week-import-row {
                grid-template-columns: auto 1fr auto;
            }

            .week-import-row label {
                grid-column: 1 / 4;
            }
        }

    </style>
</head>
<body>
    <div class="app">
        <!-- ===== MENU (élargi) ===== -->
        <div class="menu">
            <h2>
                ❦ MENU
                <small>7 jours · 2 créneaux</small>
            </h2>

            <div class="week-import-panel">
                <div class="week-title">◈ Semaine du planning</div>
                <div class="week-import-row">
                    <button class="week-nav-btn" id="prevWeekBtn" title="Semaine précédente">‹</button>
                    <input type="date" id="weekStartInput" />
                    <button class="week-nav-btn" id="nextWeekBtn" title="Semaine suivante">›</button>
                    <button class="week-nav-btn" id="currentWeekBtn" title="Semaine actuelle">Auj.</button>
                </div>
                <div class="week-import-hint" id="weekRangeLabel">Lundi → Dimanche</div>
            </div>

            <div class="day-controls" id="dayControls">
                <!-- Généré par JS -->
            </div>
            <div class="menu-actions">
                <button class="btn btn-primary" id="randomBtn">🎲 Aléatoire</button>
                <button class="btn btn-outline btn-danger" id="clearAllBtn">✕ Tout off</button>
            </div>
            <div style="font-size:0.5rem; color:#333; margin-top: 8px; text-align:center; flex-shrink:0; letter-spacing:2px; border-top:1px solid #111; padding-top:6px;">
                ⚡ Modifications en direct
            </div>
        </div>

        <!-- ===== PRÉVISUALISATION 9:16 ===== -->
        <div class="preview-wrapper">
            <h2>❧ PRÉVISUALISATION</h2>
            <div class="planning-card" id="planningCard">
                <div class="header">
                    <h1>⚔ DESTINY 2</h1>
                    <div class="ornament">✧ ✦ ✧</div>
                    <p>Planning hebdomadaire du clan</p>
                </div>
                <div class="planning-body" id="planningBody">
                    <!-- Généré par JS -->
                </div>
                <div class="footer">
                    <span>◈</span> CLAN · DESTINY 2 <span>◈</span>
                </div>
            </div>
            <div class="actions">
                <button class="btn btn-success" id="exportPngBtn">⬇ Exporter PNG</button>
                <button class="btn btn-code" id="copyGolemCodeBtn">◈ Copier code GOLEM</button>
            </div>
            <div class="code-status" id="codeStatus"></div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- DONNÉES DESTINY 2 ----------
            const DAYS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
            const ABBR = ['LUN', 'MAR', 'MER', 'JEU', 'VEN', 'SAM', 'DIM'];
            const SLOT_LABELS = ['☽ Matin', '☾ Soir'];

            const RAID_DATA = [
                "Caveau de verre",
                "Chute du roi",
                "Origines des cauchemars",
                "Chute de Cropta",
                "Jardin du salut",
                "Dernier vœu",
                "Crypte de la pierre",
                "Serment du disciple",
                "Désert perpétuel",
                "Panthéon Calus",
                "Panthéon Morgeth",
                "Panthéon Insurrection Prime"
            ];

            const DONJON_DATA = [
                "Équilibre",
                "Ruine de la Guerrière",
                "Fantôme des Profondeurs",
                "Flèche de la Vigie",
                "Trône Brisé",
                "Hôte Vesper",
                "Dualité",
                "Fosse de l'Hérésie",
                "Étreinte de l'Avarice",
                "Prophétie"
            ];

            const TAG_NAMES = {
                roulette: '🎲 Roulette',
                special: '🌟 Spéciale',
                decouverte: '🔍 Découverte',
                chill: '😎 Chill',
                maitrise: '🏆 Maîtrise',
                custom: '✎ Personnalisé'
            };

            const TAG_CLASSES = {
                roulette: 'tag-roulette',
                special: 'tag-special',
                decouverte: 'tag-decouverte',
                chill: 'tag-chill',
                maitrise: 'tag-maitrise',
                custom: 'tag-custom'
            };

            const RAID_COLORS = {
                "Caveau de verre": "#4fc3f7",
                "Chute du roi": "#81c784",
                "Origines des cauchemars": "#f48fb1",
                "Chute de Cropta": "#4caf50",
                "Jardin du salut": "#4fc3f7",
                "Dernier vœu": "#1976d2",
                "Crypte de la pierre": "#e0f7fa",
                "Serment du disciple": "#ff7043",
                "Désert perpétuel": "#b3e5fc",
                "Panthéon Calus": "#ce93d8",
                "Panthéon Morgeth": "#ffab91",
                "Panthéon Insurrection Prime": "#a5d6a7"
            };

            const ALL_ACTIVITIES = [...RAID_DATA, ...DONJON_DATA, "Personnaliser"];

            // ---------- ÉTAT ----------
            let weekData = DAYS.map((name, idx) => ({
                id: idx,
                name: name,
                abbr: ABBR[idx],
                slots: [
                    { active: false, activity: '', start: '08:00', tag: 'none', customTag: '', customActivity: '', customColor: '#ffffff' },
                    { active: false, activity: '', start: '18:00', tag: 'none', customTag: '', customActivity: '', customColor: '#ffffff' }
                ]
            }));

            // ---------- DOM ----------
            const dayControls = document.getElementById('dayControls');
            const planningBody = document.getElementById('planningBody');
            const exportBtn = document.getElementById('exportPngBtn');
            const randomBtn = document.getElementById('randomBtn');
            const clearAllBtn = document.getElementById('clearAllBtn');

            const weekStartInput = document.getElementById('weekStartInput');
            const weekRangeLabel = document.getElementById('weekRangeLabel');
            const prevWeekBtn = document.getElementById('prevWeekBtn');
            const nextWeekBtn = document.getElementById('nextWeekBtn');
            const currentWeekBtn = document.getElementById('currentWeekBtn');
            const copyGolemCodeBtn = document.getElementById('copyGolemCodeBtn');
            const codeStatus = document.getElementById('codeStatus');


            // ---------- SEMAINE RÉELLE ----------
            function dateAtLocalMidnight(year, monthIndex, day) {
                return new Date(year, monthIndex, day, 0, 0, 0, 0);
            }

            function parseLocalDate(value) {
                const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value || '');
                if (!match) return null;

                return dateAtLocalMidnight(
                    Number(match[1]),
                    Number(match[2]) - 1,
                    Number(match[3])
                );
            }

            function formatLocalDateInput(date) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            function mondayOfWeek(date) {
                const copy = new Date(date.getTime());
                copy.setHours(0, 0, 0, 0);

                const jsDay = copy.getDay();
                const offset = jsDay === 0 ? -6 : 1 - jsDay;

                copy.setDate(copy.getDate() + offset);
                return copy;
            }

            function setWeekFromDate(date) {
                const monday = mondayOfWeek(date);
                weekStartInput.value = formatLocalDateInput(monday);
                updateWeekRangeLabel();
            }

            function shiftWeek(days) {
                const base = parseLocalDate(weekStartInput.value) || mondayOfWeek(new Date());
                base.setDate(base.getDate() + days);
                setWeekFromDate(base);
            }

            function updateWeekRangeLabel() {
                const monday = parseLocalDate(weekStartInput.value);

                if (!monday) {
                    weekRangeLabel.textContent = 'Choisir le lundi de la semaine';
                    return;
                }

                const sunday = new Date(monday.getTime());
                sunday.setDate(sunday.getDate() + 6);

                const fmt = new Intl.DateTimeFormat('fr-FR', {
                    day: '2-digit',
                    month: 'long',
                    year: 'numeric'
                });

                weekRangeLabel.textContent =
                    `Du ${fmt.format(monday)} au ${fmt.format(sunday)}`;
            }

            // ---------- GÉNÉRATION DU CODE GOLEM-WEEK ----------
            function activityTypeFor(name) {
                if (RAID_DATA.includes(name)) return 'Raid';
                if (DONJON_DATA.includes(name)) return 'Donjon';
                return 'Autre';
            }

            function activityNameFor(slot) {
                if (slot.activity === 'Personnaliser') {
                    return (slot.customActivity || '').trim();
                }

                return (slot.activity || '').trim();
            }

            function tagLabelFor(slot) {
                if (slot.tag === 'custom') {
                    return (slot.customTag || '').trim();
                }

                if (slot.tag && slot.tag !== 'none') {
                    return TAG_NAMES[slot.tag] || '';
                }

                return '';
            }

            function slotDateTime(dayIndex, timeValue) {
                const monday = parseLocalDate(weekStartInput.value);

                if (!monday) {
                    throw new Error('Choisis d’abord la semaine du planning.');
                }

                const [hours, minutes] = String(timeValue || '00:00')
                    .split(':')
                    .map(Number);

                const date = new Date(monday.getTime());
                date.setDate(date.getDate() + dayIndex);
                date.setHours(hours || 0, minutes || 0, 0, 0);

                return date.toISOString();
            }

            function buildGolemWeekPayload() {
                const monday = parseLocalDate(weekStartInput.value);

                if (!monday) {
                    throw new Error('La date de semaine est invalide.');
                }

                const activities = [];

                weekData.forEach((day, dayIndex) => {
                    day.slots.forEach((slot, slotIndex) => {
                        if (!slot.active) return;

                        const name = activityNameFor(slot);

                        if (!name) {
                            throw new Error(
                                `${day.name} — ${SLOT_LABELS[slotIndex]} : aucune activité choisie.`
                            );
                        }

                        const activityType = activityTypeFor(name);
                        const scheduledAt = slotDateTime(dayIndex, slot.start);

                        activities.push({
                            name,
                            activity_type: activityType,
                            scheduled_at: scheduledAt,

                            // Le Control Panel pourra ensuite choisir librement
                            // l'heure de publication. L'importeur actuel utilise
                            // scheduled_at comme valeur de sécurité si publish_at
                            // n'est pas renseigné.
                            publish_at: null,

                            tag: tagLabelFor(slot),
                            color:
                                slot.customColor ||
                                RAID_COLORS[name] ||
                                '#ffffff',

                            max_players:
                                activityType === 'Donjon'
                                    ? 3
                                    : 6,

                            counts_for_clan: true,

                            description:
                                slot.tag && slot.tag !== 'none'
                                    ? tagLabelFor(slot)
                                    : ''
                        });
                    });
                });

                if (!activities.length) {
                    throw new Error('Aucune activité active dans le planning.');
                }

                return {
                    format: 'GOLEM-WEEK',
                    version: 1,
                    week_start: formatLocalDateInput(monday),
                    generated_at: new Date().toISOString(),
                    activities
                };
            }

            function encodeBase64UrlUtf8(value) {
                const bytes = new TextEncoder().encode(value);
                let binary = '';

                for (const byte of bytes) {
                    binary += String.fromCharCode(byte);
                }

                return btoa(binary)
                    .replace(/\+/g, '-')
                    .replace(/\//g, '_')
                    .replace(/=+$/g, '');
            }

            function generateGolemWeekCode() {
                const payload = buildGolemWeekPayload();
                const encoded = encodeBase64UrlUtf8(JSON.stringify(payload));
                return {
                    code: `GOLEM-WEEK:${encoded}`,
                    count: payload.activities.length,
                    payload
                };
            }

            async function copyTextReliable(text) {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return;
                }

                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.setAttribute('readonly', '');
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                textarea.style.pointerEvents = 'none';

                document.body.appendChild(textarea);
                textarea.select();

                const ok = document.execCommand('copy');
                textarea.remove();

                if (!ok) {
                    throw new Error('Copie automatique refusée par le navigateur.');
                }
            }

            async function copyGolemWeekCode() {
                try {
                    const result = generateGolemWeekCode();

                    await copyTextReliable(result.code);

                    codeStatus.innerHTML =
                        `<strong>✓ CODE GOLEM COPIÉ</strong><br>` +
                        `${result.count} activité(s) prête(s) à être importée(s) dans le Control Panel.`;

                    codeStatus.classList.add('visible');

                    setTimeout(() => {
                        codeStatus.classList.remove('visible');
                    }, 6500);
                } catch (error) {
                    codeStatus.innerHTML =
                        `<strong>ERREUR</strong><br>${error.message}`;
                    codeStatus.classList.add('visible');
                }
            }

            // ---------- RENDU DU MENU ----------
            function renderMenu() {
                let html = '';
                weekData.forEach((day, dayIdx) => {
                    html += `<div class="day-control" data-day="${dayIdx}">
                                <div class="day-label">
                                    ${day.abbr} <span>${day.name}</span>
                                </div>`;

                    day.slots.forEach((slot, slotIdx) => {
                        const inactiveClass = slot.active ? '' : 'inactive-slot';
                        html += `
                                    <div class="slot-row ${inactiveClass}" data-day="${dayIdx}" data-slot="${slotIdx}">
                                        <span class="slot-label">${SLOT_LABELS[slotIdx]}</span>
                                        <label class="switch">
                                            <input type="checkbox" class="slot-toggle" ${slot.active ? 'checked' : ''} />
                                            <span class="slider"></span>
                                        </label>
                                        <select class="activity-select">
                                            <option value="">Choisir...</option>

                                            <optgroup label="──────── RAIDS ────────">
                                                ${RAID_DATA.map(a => `<option value="${a}" ${a === slot.activity ? 'selected' : ''}>${a}</option>`).join('')}
                                            </optgroup>

                                            <optgroup label="─────── DONJONS ───────">
                                                ${DONJON_DATA.map(a => `<option value="${a}" ${a === slot.activity ? 'selected' : ''}>${a}</option>`).join('')}
                                            </optgroup>

                                            <optgroup label="──── PERSONNALISÉ ────">
                                                <option value="Personnaliser" ${slot.activity === 'Personnaliser' ? 'selected' : ''}>✎ Personnaliser</option>
                                            </optgroup>
                                        </select>

                                        <input
                                            type="text"
                                            class="custom-activity-input"
                                            value="${slot.customActivity || ''}"
                                            placeholder="Nom de l'activité..."
                                            maxlength="40"
                                            style="${slot.activity === 'Personnaliser' ? '' : 'display:none;'} flex:1 1 58%; min-width:160px; background:#000; border:1px solid #444; color:#fff; padding:6px 9px; font-family:'Cormorant Garamond',serif; font-size:1rem;"
                                        />

                                        <input
                                            type="color"
                                            class="custom-color-input"
                                            value="${slot.customColor || RAID_COLORS[slot.activity] || '#ffffff'}"
                                            title="Couleur de l'activité"
                                            style="width:42px; min-width:42px; height:36px; padding:2px; background:#000; border:1px solid #444; cursor:pointer;"
                                        />

                                        <input type="time" class="start-input" value="${slot.start}" />
                                        <select class="tag-select">
                                            <option value="none" ${slot.tag === 'none' ? 'selected' : ''}>Aucun</option>
                                            <option value="roulette" ${slot.tag === 'roulette' ? 'selected' : ''}>🎲 Roulette</option>
                                            <option value="special" ${slot.tag === 'special' ? 'selected' : ''}>🌟 Spéciale</option>
                                            <option value="decouverte" ${slot.tag === 'decouverte' ? 'selected' : ''}>🔍 Découverte</option>
                                            <option value="chill" ${slot.tag === 'chill' ? 'selected' : ''}>😎 Chill</option>
                                            <option value="maitrise" ${slot.tag === 'maitrise' ? 'selected' : ''}>🏆 Maîtrise</option>
                                            <option value="custom" ${slot.tag === 'custom' ? 'selected' : ''}>✎ Personnalisé</option>
                                        </select>
                                        <input
                                            type="text"
                                            class="custom-tag-input"
                                            value="${slot.customTag || ''}"
                                            placeholder="Nom du tag..."
                                            maxlength="24"
                                            style="${slot.tag === 'custom' ? '' : 'display:none;'} flex:1 1 100%; min-width:100%; background:#000; border:1px solid #444; color:#fff; padding:5px 7px; font-family:'Cinzel',serif; font-size:.65rem;"
                                        />
                                    </div>
                                `;
                    });

                    html += `</div>`;
                });
                dayControls.innerHTML = html;

                document.querySelectorAll('.slot-row').forEach((row) => {
                    const dayIdx = parseInt(row.dataset.day);
                    const slotIdx = parseInt(row.dataset.slot);
                    const toggle = row.querySelector('.slot-toggle');
                    const activitySelect = row.querySelector('.activity-select');
                    const customActivityInput = row.querySelector('.custom-activity-input');
                    const customColorInput = row.querySelector('.custom-color-input');
                    const startInput = row.querySelector('.start-input');
                    const tagSelect = row.querySelector('.tag-select');
                    const customTagInput = row.querySelector('.custom-tag-input');

                    const updateSlot = () => {
                        const slot = weekData[dayIdx].slots[slotIdx];
                        slot.active = toggle.checked;
                        slot.activity = activitySelect.value;
                        slot.customActivity = customActivityInput ? customActivityInput.value.trim() : '';
                        slot.customColor = customColorInput ? customColorInput.value : '#ffffff';

                        const isCustomActivity = slot.activity === 'Personnaliser';
                        if (customActivityInput) customActivityInput.style.display = isCustomActivity ? '' : 'none';

                        slot.start = startInput.value;
                        slot.tag = tagSelect.value;
                        slot.customTag = customTagInput ? customTagInput.value.trim() : '';
                        if (customTagInput) {
                            customTagInput.style.display = slot.tag === 'custom' ? '' : 'none';
                        }

                        row.classList.toggle('inactive-slot', !slot.active);
                        renderPreview();
                    };

                    toggle.addEventListener('change', updateSlot);
                    activitySelect.addEventListener('change', () => {
                        if (customColorInput) {
                            customColorInput.value = RAID_COLORS[activitySelect.value] || '#ffffff';
                        }
                        updateSlot();
                    });
                    if (customActivityInput) customActivityInput.addEventListener('input', updateSlot);
                    if (customColorInput) customColorInput.addEventListener('input', updateSlot);
                    startInput.addEventListener('input', updateSlot);
                    tagSelect.addEventListener('change', updateSlot);
                    if (customTagInput) customTagInput.addEventListener('input', updateSlot);
                });
            }

            // ---------- RENDU PRÉVISUALISATION ----------
            function renderPreview() {
                let html = '';

                weekData.forEach((day) => {
                    const activeSlots = day.slots.filter(s => s.active);

                    if (activeSlots.length === 0) {
                        html += `
                            <div class="day-row inactive">
                                <span class="day-abbr">${day.abbr}</span>
                                <span class="day-off">— OFF —</span>
                            </div>
                        `;
                        return;
                    }

                    let slotBlocks = '';
                    day.slots.forEach((slot) => {
                        if (!slot.active) {
                            slotBlocks += `<div class="slot-line slot-off">— OFF —</div>`;
                            return;
                        }

                        const isCustomActivity = slot.activity === 'Personnaliser';
                        const activity = isCustomActivity
                            ? (slot.customActivity || 'Activité personnalisée')
                            : (slot.activity || '◈ Activité');
                        const color = slot.customColor
                            || RAID_COLORS[activity]
                            || '#ffffff';
                        const tagClass = slot.tag !== 'none' ? (TAG_CLASSES[slot.tag] || '') : '';
                        const tagLabel = slot.tag === 'custom'
                            ? (slot.customTag || 'Personnalisé')
                            : (slot.tag !== 'none' ? (TAG_NAMES[slot.tag] || '') : '');

                        slotBlocks += `
                            <div class="slot-line">
                                <span class="slot-time">${slot.start}</span>
                                <span class="slot-activity" style="color:${color};">${activity}</span>
                                ${tagLabel ? `<span class="slot-tag ${tagClass}">${tagLabel}</span>` : ''}
                            </div>
                        `;
                    });

                    html += `
                        <div class="day-row has-slots">
                            <span class="day-abbr">${day.abbr}</span>
                            <div class="slots-container">
                                ${slotBlocks}
                            </div>
                        </div>
                    `;
                });

                planningBody.innerHTML = html;
            }

            // ---------- MISE À JOUR ----------
            function updateAll() {
                renderMenu();
                renderPreview();
            }

            // ---------- DÉMO ----------
            function loadDemo() {
                weekData = [
                    { id: 0, name: 'Lundi', abbr: 'LUN', slots: [
                            { active: true, activity: 'Caveau de verre', start: '08:00', tag: 'special', customTag: '' },
                            { active: true, activity: 'Chute du roi', start: '18:00', tag: 'roulette', customTag: '' }
                        ] },
                    { id: 1, name: 'Mardi', abbr: 'MAR', slots: [
                            { active: false, activity: '', start: '08:00', tag: 'none', customTag: '', customActivity: '', customColor: '#ffffff' },
                            { active: true, activity: 'Dualité', start: '19:00', tag: 'chill', customTag: '' }
                        ] },
                    { id: 2, name: 'Mercredi', abbr: 'MER', slots: [
                            { active: true, activity: 'Serment du disciple', start: '09:00', tag: 'decouverte', customTag: '' },
                            { active: false, activity: '', start: '18:00', tag: 'none', customTag: '', customActivity: '', customColor: '#ffffff' }
                        ] },
                    { id: 3, name: 'Jeudi', abbr: 'JEU', slots: [
                            { active: false, activity: '', start: '08:00', tag: 'none', customTag: '', customActivity: '', customColor: '#ffffff' },
                            { active: false, activity: '', start: '18:00', tag: 'none', customTag: '', customActivity: '', customColor: '#ffffff' }
                        ] },
                    { id: 4, name: 'Vendredi', abbr: 'VEN', slots: [
                            { active: true, activity: 'Origines des cauchemars', start: '10:00', tag: 'maitrise', customTag: '' },
                            { active: true, activity: 'Étreinte de l\'Avarice', start: '20:00', tag: 'special' }
                        ] },
                    { id: 5, name: 'Samedi', abbr: 'SAM', slots: [
                            { active: true, activity: 'Dernier vœu', start: '14:00', tag: 'roulette', customTag: '' },
                            { active: true, activity: 'Panthéon Calus', start: '21:00', tag: 'decouverte', customTag: '' }
                        ] },
                    { id: 6, name: 'Dimanche', abbr: 'DIM', slots: [
                            { active: true, activity: 'Crypte de la pierre', start: '11:00', tag: 'chill', customTag: '' },
                            { active: false, activity: '', start: '18:00', tag: 'none', customTag: '', customActivity: '', customColor: '#ffffff' }
                        ] }
                ];
                updateAll();
            }

            // ---------- PLANNING ALÉATOIRE ----------
            function randomizePlanning() {
                const tags = ['roulette', 'special', 'decouverte', 'chill', 'maitrise'];
                const times = ['08:00', '09:00', '10:00', '11:00', '14:00', '18:00', '19:00', '20:00', '21:00'];

                weekData.forEach(day => {
                    day.slots.forEach(slot => {
                        // Toujours vider l'ancien tag personnalisé avant de randomiser.
                        // Ainsi, aucune ancienne valeur customTag ne peut rester en mémoire.
                        slot.customTag = '';

                        // Environ 70 % de chance qu'un créneau soit actif.
                        slot.active = Math.random() < 0.70;

                        if (slot.active) {
                            const randomActivities = ALL_ACTIVITIES.filter(a => a !== 'Personnaliser');
                            slot.activity = randomActivities[Math.floor(Math.random() * randomActivities.length)];
                            slot.customActivity = '';
                            slot.customColor = RAID_COLORS[slot.activity] || '#ffffff';
                            slot.start = times[Math.floor(Math.random() * times.length)];
                            slot.tag = tags[Math.floor(Math.random() * tags.length)];
                        } else {
                            slot.activity = '';
                            slot.customActivity = '';
                            slot.customColor = '#ffffff';
                            slot.tag = 'none';
                        }
                    });
                });

                updateAll();
            }

            // ---------- TOUT DÉSACTIVER ----------
            function clearAll() {
                weekData.forEach(day => {
                    day.slots.forEach(slot => { slot.active = false;
                        slot.activity = '';
                        slot.customActivity = '';
                        slot.customColor = '#ffffff';
                        slot.tag = 'none';
                        slot.customTag = ''; });
                });
                updateAll();
            }

            // ---------- EXPORT PNG ----------
            function exportPng() {
                const card = document.getElementById('planningCard');
                html2canvas(card, {
                    scale: 2.5,
                    useCORS: true,
                    backgroundColor: '#000000',
                    allowTaint: false,
                    logging: false,
                }).then((canvas) => {
                    const link = document.createElement('a');
                    link.download = 'planning_golem_clan.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch((err) => {
                    alert('Erreur export : ' + err);
                });
            }

            // ---------- BOUTONS ----------
            exportBtn.addEventListener('click', exportPng);
            randomBtn.addEventListener('click', randomizePlanning);
            clearAllBtn.addEventListener('click', clearAll);

            copyGolemCodeBtn.addEventListener('click', copyGolemWeekCode);

            prevWeekBtn.addEventListener('click', () => shiftWeek(-7));
            nextWeekBtn.addEventListener('click', () => shiftWeek(7));
            currentWeekBtn.addEventListener('click', () => setWeekFromDate(new Date()));

            weekStartInput.addEventListener('change', () => {
                const selected = parseLocalDate(weekStartInput.value);
                if (selected) setWeekFromDate(selected);
            });

            // ---------- INIT ----------
            setWeekFromDate(new Date());
            updateAll();
        })();
    </script>
</body>
</html>
